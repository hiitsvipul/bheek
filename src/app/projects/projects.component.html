<section id="projects" #projectsSection class="py-20 md:py-32 bg-white dark:bg-gray-900">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Section Header -->
    <div class="text-center mb-16 fade-in-on-scroll">
      <h2 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Our Projects
      </h2>
      <div class="w-24 h-1 bg-gradient-to-r from-blue-600 to-purple-600 mx-auto rounded-full mb-6"></div>
      <p class="text-lg text-gray-600 dark:text-gray-300 max-w-3xl mx-auto">
        Here are some of the projects we've worked on, showcasing our expertise in full-stack development, dashboards, and scalable backend systems.
      </p>
    </div>

    <!-- Projects Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div 
        *ngFor="let project of projects"
        class="project-card group bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-300 border border-gray-200 dark:border-gray-700 fade-in-on-scroll">
        
        <!-- Project Image Placeholder with Gradient -->
        <div class="relative h-48 bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 overflow-hidden">
          <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-all duration-300"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <svg class="w-16 h-16 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
            </svg>
          </div>
          
          <!-- Hover Overlay -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-center pb-6">
            <div class="flex space-x-4">
              <button class="px-4 py-2 bg-white text-gray-900 rounded-lg font-medium hover:bg-gray-100 transition-colors transform hover:scale-105">
                View Details
              </button>
              <button class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors transform hover:scale-105">
                Live Demo
              </button>
            </div>
          </div>
        </div>

        <!-- Project Content -->
        <div class="p-6">
          <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-3 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
            {{ project.title }}
          </h3>
          
          <p class="text-gray-600 dark:text-gray-400 text-sm mb-4 line-clamp-3">
            {{ project.description }}
          </p>

          <!-- Tech Stack Badges -->
          <div class="flex flex-wrap gap-2 mb-4">
            <span 
              *ngFor="let tech of project.techStack"
              class="px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 text-xs font-medium rounded-full">
              {{ tech }}
            </span>
          </div>

          <!-- Features -->
          <div class="space-y-2">
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">
              Key Features
            </p>
            <div class="grid grid-cols-2 gap-2">
              <div 
                *ngFor="let feature of project.features"
                class="flex items-center space-x-1 text-xs text-gray-600 dark:text-gray-400">
                <svg class="w-3 h-3 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                </svg>
                <span>{{ feature }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Card Bottom Border Animation -->
        <div class="h-1 bg-gradient-to-r from-blue-600 to-purple-600 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
      </div>
    </div>

    <!-- CTA Section -->
    <div class="mt-16 text-center fade-in-on-scroll">
      <p class="text-lg text-gray-600 dark:text-gray-300 mb-6">
        Want to see more projects or discuss your idea?
      </p>
      <button 
        class="px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg font-semibold hover:shadow-xl hover:scale-105 transition-all duration-300">
        Get In Touch
      </button>
    </div>

  </div>
</section>
