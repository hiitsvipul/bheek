<nav 
  [class.scrolled]="isScrolled()"
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
  
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16 md:h-20">
      
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a (click)="navigateTo('home')" class="cursor-pointer">
          <img 
            *ngIf="!themeService.darkMode()" 
            src="vss final logo black.png" 
            alt="Vandana Social Studios" 
            class="h-16 sm:h-24 md:h-32 w-auto">
          <img 
            *ngIf="themeService.darkMode()" 
            src="vss final logo white.png" 
            alt="Vandana Social Studios" 
            class="h-16 sm:h-24 md:h-32 w-auto">
        </a>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-8">
        <a 
          *ngFor="let item of menuItems"
          (click)="navigateTo(item.id)"
          [class.active]="activeSection() === item.id"
          class="nav-link cursor-pointer text-gray-700 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition-colors duration-200 font-medium relative">
          {{ item.label }}
        </a>
        
        <!-- Theme Toggle Button -->
        <button 
          (click)="themeService.toggleTheme()"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all duration-200"
          aria-label="Toggle theme">
          <svg *ngIf="!themeService.darkMode()" class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <svg *ngIf="themeService.darkMode()" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <div class="flex md:hidden items-center space-x-4">
        <!-- Theme Toggle (Mobile) -->
        <button 
          (click)="themeService.toggleTheme()"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800"
          aria-label="Toggle theme">
          <svg *ngIf="!themeService.darkMode()" class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <svg *ngIf="themeService.darkMode()" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>

        <!-- Hamburger Button -->
        <button 
          (click)="toggleMenu()"
          class="p-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
          aria-label="Toggle menu">
          <svg *ngIf="!isMenuOpen()" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg *ngIf="isMenuOpen()" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div 
    *ngIf="isMenuOpen()"
    class="md:hidden mobile-menu bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800">
    <div class="px-4 py-6 space-y-4">
      <a 
        *ngFor="let item of menuItems"
        (click)="navigateTo(item.id)"
        [class.active]="activeSection() === item.id"
        class="block py-2 text-gray-700 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition-colors font-medium cursor-pointer">
        {{ item.label }}
      </a>
    </div>
  </div>
</nav>
