<section id="tech-stack" #techStackSection class="py-20 md:py-32 bg-gray-50 dark:bg-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Section Header -->
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Our Process
      </h2>
      <div class="w-24 h-1 bg-gradient-to-r from-orange-600 to-orange-500 mx-auto rounded-full mb-6"></div>
      <p class="text-lg text-gray-600 dark:text-gray-300 max-w-3xl mx-auto">
        Our proven 5-step process to grow your brand on social media
      </p>
    </div>

    <!-- Categorized Tech Stack -->
    <div class="space-y-12">
      <div 
        *ngFor="let category of categorizedTech">
        
        <!-- Category Title -->
        <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-6 text-center">
          {{ category.name }}
        </h3>

        <!-- Tech Items Grid -->
        <div class="flex justify-center">
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-6 max-w-3xl">
            <div 
              *ngFor="let tech of category.items"
              class="tech-card group bg-white dark:bg-gray-900 rounded-xl p-6 shadow-md hover:shadow-xl transition-all duration-300 border border-gray-200 dark:border-gray-700 hover:border-orange-500 dark:hover:border-orange-500 flex flex-col items-center justify-center text-center">
              
              <!-- Icon Container -->
              <div class="w-16 h-16 mb-4 flex items-center justify-center bg-gradient-to-br from-orange-600 to-orange-500 rounded-lg group-hover:scale-110 transition-transform duration-300">
              <!-- Generic Tech Icon (you can replace with actual logos) -->
              <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path *ngIf="tech.icon === 'angular' || tech.icon === 'frontend' || tech.icon === 'typescript'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                <path *ngIf="tech.icon === 'tailwind'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
                <path *ngIf="tech.icon === 'material'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1v-3z"/>
                <path *ngIf="tech.icon === 'java' || tech.icon === 'spring' || tech.icon === 'backend'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>
                <path *ngIf="tech.icon === 'api'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                <path *ngIf="tech.icon === 'microservices'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                <path *ngIf="tech.icon === 'mongodb'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
                <path *ngIf="tech.icon === 'jwt' || tech.icon === 'security' || tech.icon === 'secure'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                <path *ngIf="tech.icon === 'architecture'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                <path *ngIf="tech.icon === 'components'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1v-3z"/>
                <path *ngIf="tech.icon === 'scale'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>
                <path *ngIf="tech.icon === 'performance'" 
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M13 10V3L4 14h7v7l9-11h-7z"/>
              </svg>
            </div>

            <!-- Tech Name -->
            <h4 class="font-semibold text-gray-900 dark:text-white group-hover:text-orange-600 dark:group-hover:text-orange-400 transition-colors mb-2">
              {{ tech.name }}
            </h4>
            
            <!-- Tech Description -->
            <p *ngIf="tech.description" class="text-xs text-gray-600 dark:text-gray-400 mt-1">
              {{ tech.description }}
            </p>
          </div>
        </div>
        </div>
      </div>
    </div>

  </div>
</section>
